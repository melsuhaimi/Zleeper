name: Android verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_FLAGS: "--no-daemon --stacktrace --info"

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew $GRADLE_FLAGS compileDebugKotlin

      - name: Run unit tests
        run: ./gradlew $GRADLE_FLAGS testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew $GRADLE_FLAGS lintDebug

      - name: Verify Compose navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew $GRADLE_FLAGS connectedDebugAndroidTest

      - name: Assemble debug APK
        run: ./gradlew $GRADLE_FLAGS assembleDebug

      - name: Validate debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zleeper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
